[env:bluepill_f103c8_dfu]
platform = ststm32
board = bluepill_f103c8
framework = stm32cube

upload_protocol = custom
upload_command = sudo dfu-util -a 2 -d 1eaf:0003 -R -D $SOURCE

board_build.offset = 0x2000
board_upload.offset_address = 0x08002000
board_build.ldscript = STM32F103C8_2000.ld

# ============================================================================
# Build Flags
# ============================================================================
build_flags =
    -D VECT_TAB_OFFSET=0x2000U
    -D USER_VECT_TAB_ADDRESS
    -D HSE_VALUE=8000000
    ; Убрать USE_FULL_ASSERT чтобы избежать ошибки с stm32_assert.h
    ; -D USE_FULL_ASSERT
    -D DEBUG
    ; Для системного тестирования и отладки
    -D DEBUG_INTEGRATION
    -D DEBUG_SYSTEM_TEST
    ; Оптимизация по размеру
    -Os
    ; Математическая библиотека (добавляется в той же секции)
    -lm

lib_deps =

lib_archive = no
lib_compat_mode = strict
lib_ldf_mode = chain+

# ============================================================================
# Debug Settings
# ============================================================================
debug_tool = stlink
debug_port = :4242

# ============================================================================
# Monitor Settings (Serial Terminal)
# ============================================================================
monitor_speed = 115200
; Новый синтаксис для PlatformIO
monitor_filters = 
    colorize
    send_on_enter
    
monitor_raw = false
monitor_echo = true
monitor_rts = 0
monitor_dtr = 0